<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unisphere - Backoffice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="login-card p-5">
        <div class="text-center mb-4">
            <img src="src/assets/images/Logo_Site_Web.png" alt="Unisphere" style="max-width: 150px;" class="mb-3">
            <h2>Bienvenue sur Unisphere</h2>
            <p class="text-muted">Administration</p>
        </div>
        <div class="text-center">
            <a href="View/Backoffice/dashboard.html" class="btn btn-primary btn-lg">
                <i class="fas fa-tachometer-alt me-2"></i>Accéder au Dashboard
            </a>
        </div>
        <hr class="my-4">
        <div class="text-center">
            <p class="text-muted mb-2">Pages disponibles:</p>
            <div class="d-flex flex-wrap gap-2 justify-content-center">
                <a href="View/Backoffice/quizList.html" class="btn btn-sm btn-outline-primary">Quiz</a>
                <a href="View/Backoffice/userList.html" class="btn btn-sm btn-outline-primary">Utilisateurs</a>
                <a href="View/Backoffice/gameResults.html" class="btn btn-sm btn-outline-primary">Résultats</a>
                <a href="View/Backoffice/leaderboard.html" class="btn btn-sm btn-outline-primary">Classement</a>
                <a href="View/Backoffice/bookList.html" class="btn btn-sm btn-outline-primary">Bibliothèque</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
